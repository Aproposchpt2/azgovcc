[build]
  publish = "."
  functions = "netlify/functions"

  [build.environment]
    NODE_VERSION = "18"

[functions]
  node_bundler = "esbuild"
  # az-pipeline.js reads bids.json at runtime via fs.readFileSync, not a
  # static require/import -- esbuild can't trace that, so without this the
  # committed bids.json never makes it into the deployed function bundle and
  # the function silently falls back to SAMPLE_BIDS forever. Confirmed live
  # 2026-08-16: real bids.json committed, function still returned
  # scanMode:"sample" until this was added.
  included_files = ["bids.json"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/dashboard"
  to   = "/dashboard.html"
  status = 200

[[redirects]]
  from = "/login"
  to   = "/login.html"
  status = 200

[[redirects]]
  from = "/onboarding"
  to   = "/onboarding.html"
  status = 200

[[redirects]]
  from = "/proposal"
  to   = "/proposal.html"
  status = 200

[[redirects]]
  from = "/services"
  to   = "/services.html"
  status = 200

