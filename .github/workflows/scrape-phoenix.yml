name: Scrape Phoenix (AZ) and sync to Supabase

on:
  schedule:
    - cron: '0 13 * * 1'   # ~6am Pacific, every Monday — same weekly floor as NGEM
  workflow_dispatch:        # manual trigger

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Randomized delay (scheduled runs only -- keeps the real request time from landing at the same minute every week)
        if: github.event_name == 'schedule'
        run: |
          DELAY=$((RANDOM % 10800))
          echo "Sleeping ${DELAY}s before starting..."
          sleep $DELAY
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/scrape-phoenix.js
      - name: Commit refreshed bids.json
        run: |
          git config user.name "azgovcc-bot"
          git config user.email "bot@aproposgroupllc.com"
          git add bids.json
          git commit -m "data: refresh Phoenix bids" || echo "no changes to commit"
          git push
      - name: Sync into Supabase raw table (state_contract_opportunities)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-supabase-az.js
